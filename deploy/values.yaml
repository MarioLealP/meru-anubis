# anubis's deployment, rendered by Argo CD with Meru's nuwa-app chart. Shikigami fills in what comes from the
# request (owner, size, route) and adds deploy/meru.yaml - the marker that makes Meru deploy this repo - once the
# app's namespace fence, signing key and build credentials exist. CI writes the image after each build; until the
# first one the digest is a placeholder: nuwa-app renders everything but the workload (the build runner comes up, no
# pod waits on an image that doesn't exist yet).
name: anubis
owner: mario
image:
  repository: zot.clockmost.com/meru/anubis
  digest: sha256:b7ab639a4beae6b790321f476a390125b024d0f8d8b9d1235b7a31d3431597d9
  tag: "31b2310350f1"
# A daily pass (D107's shape, D114), not a service: a CronJob, no Service, no probes. 11:30 Lisbon - half an hour after
# Charon's 11:00 pass, so a purge that ran today is already seen, and when the server is on.
job:
  schedule: "30 11 * * *"
# Thoth, read-only: the pod's own token is the login (D104; infra blueprints thoth.yaml lists anubis/anubis).
authentikLogin:
  enabled: true
# Its own token for the cluster (Meru/meru rbac/anubis-findings.yaml): write the findings ConfigMap, nothing else.
kubernetesApi:
  enabled: true
# The bot's token (D116): read-only, on Meru/requests alone - a retired app's removedAt + retention.
secretEnv:
  ANUBIS_GITEA_TOKEN:
    secret: gitea
    key: token
externalSecrets:
  gitea: {}
# Verdicts on (D118): Mario read the dry run anubis-dry-1 (2026-11-05: 10 gone workloads, each a 404) - "3 to 10 is
# right, 1 and 2, i trust u". Off = a pass only logs "would be ...".
env:
  ANUBIS_GIVE_VERDICTS: "true"

# Crash reports (D125): this app's GlitchTip project, which Shikigami made (it predates the marker's own DSN line).
glitchtip:
  dsn: https://d7d5651c807e484bb1433ee7ea3d0b30@glitchtip.clockmost.com/7
